name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write # needed to create/upload release assets when a tag is pushed

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Build release (static CRT via .cargo/config.toml)
        run: cargo build --release

      - name: Upload exe as build artifact
        uses: actions/upload-artifact@v7
        with:
          name: NoSleepTillBrooklyn
          path: target/release/NoSleepTillBrooklyn.exe

      # On a version tag (e.g. v0.1.0), attach the exe to the GitHub release.
      - name: Attach exe to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: target/release/NoSleepTillBrooklyn.exe
          generate_release_notes: true
