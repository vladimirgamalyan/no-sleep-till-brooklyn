[package]
name = "no-sleep-till-brooklyn"
version = "0.2.0"
edition = "2021"
description = "A tiny caffeine-style utility that keeps Windows awake while its window is open"
license = "MIT"

[[bin]]
name = "NoSleepTillBrooklyn"
path = "src/main.rs"

[dependencies]
native-windows-gui = "1.0.13"
native-windows-derive = "1.0.5"

[build-dependencies]
embed-resource = "3"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Power",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
